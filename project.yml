name: BoatMenuBar
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: G8N2V7JRQ3
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "17"
    SWIFT_VERSION: "5.0"
    ENABLE_HARDENED_RUNTIME: NO

targets:
  BoatMenuBar:
    type: application
    platform: macOS
    sources:
      - path: Sources/BoatMenuBar
      - path: Sources/Shared
      - path: Support/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.boatmenubar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Support/BoatMenuBar-Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/BoatMenuBar.entitlements
        # A menu bar utility: no Dock icon, no main window.
        LSUIElement: YES
        ENABLE_APP_SANDBOX: NO
    dependencies:
      - target: BoatWidget
        embed: true
        codeSign: true

  BoatWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/BoatWidget
      - path: Sources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.boatmenubar.widget
        INFOPLIST_FILE: Support/BoatWidget-Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/BoatWidget.entitlements
        # Widget extensions are always sandboxed.
        ENABLE_APP_SANDBOX: YES
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
